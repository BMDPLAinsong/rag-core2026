<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 知识库系统</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --primary: #4f6ef7; --primary-dark: #3b55d9;
    --primary-soft: #eef1ff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    --bot-bg: #ffffff; --user-bg: #4f6ef7; --user-text: #ffffff;
    --code-bg: #eef0f6; --pre-bg: #1f2430; --pre-text: #e2e8f0;
    --ok: #10b981; --warn: #f59e0b; --err: #ef4444;
    --shadow: 0 1px 3px rgba(15, 23, 42, .06);
    --hl: rgba(79, 110, 247, .18);
  }
  [data-theme="dark"] {
    --bg: #0e1115; --card: #1a2029; --primary: #5b7bff; --primary-dark: #4f6ef7;
    --primary-soft: #1e2637; --text: #e6eaf2; --muted: #97a1b0; --border: #333d4c;
    --bot-bg: #1f2732; --user-bg: #4f6ef7; --user-text: #ffffff;
    --code-bg: #262e3a; --pre-bg: #11151b; --pre-text: #dbe4f0;
    --ok: #34d399; --warn: #fbbf24; --err: #f87171;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
    --hl: rgba(91, 123, 255, .28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }

  /* ─── 顶栏 ─── */
  header {
    background: var(--card); padding: 10px 20px; flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border); position: relative; z-index: 5;
  }
  header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, var(--primary), transparent 70%); opacity: .55;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 15px;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  header .spacer { flex: 1; }
  .icon-btn {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .icon-btn:hover { color: var(--primary); border-color: var(--primary); }
  .icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor;
                  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn {
    border: none; border-radius: 9px; padding: 7px 14px; font-size: 13.5px;
    cursor: pointer; background: var(--primary); color: #fff; transition: background .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn.ghost:hover { color: var(--err); border-color: var(--err); background: transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ─── 三栏主体 ─── */
  main { flex: 1; display: flex; min-height: 0; }
  .panel { background: var(--card); display: flex; flex-direction: column; min-height: 0; }
  .panel-head {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .panel-head h2 { font-size: 14px; font-weight: 600; flex: 1; }
  .panel-body { flex: 1; overflow-y: auto; padding: 10px; }
  .panel-body::-webkit-scrollbar { width: 7px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .hint { color: var(--muted); font-size: 12.5px; text-align: center; padding: 24px 10px; line-height: 1.7; }

  /* ─── 左栏：知识库 ─── */
  #kbPanel { width: 272px; border-right: 1px solid var(--border); flex-shrink: 0; }
  .kb-item {
    padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 6px;
    border: 1px solid transparent; transition: all .15s;
  }
  .kb-item:hover { background: var(--bg); }
  .kb-item.active { background: var(--primary-soft); border-color: var(--primary); }
  .kb-item .name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .kb-item .meta { font-size: 12px; color: var(--muted); }
  .kb-item .del {
    float: right; border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 13px; padding: 2px; border-radius: 5px; visibility: hidden;
  }
  .kb-item:hover .del { visibility: visible; }
  .kb-item .del:hover { color: var(--err); }

  .doc-item {
    padding: 10px 12px; border-radius: 10px; margin-bottom: 6px;
    border: 1px solid var(--border); background: var(--bg);
  }
  .doc-item .row1 { display: flex; align-items: center; gap: 6px; }
  .doc-item .fname {
    flex: 1; font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-item .acts { display: flex; gap: 2px; visibility: hidden; }
  .doc-item:hover .acts { visibility: visible; }
  .doc-item .acts button {
    border: none; background: none; cursor: pointer; font-size: 13px;
    padding: 2px 4px; border-radius: 5px; color: var(--muted);
  }
  .doc-item .acts button:hover { background: var(--card); color: var(--primary); }
  .doc-item .acts button.danger:hover { color: var(--err); }
  .doc-item .row2 { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .st-ok { color: var(--ok); } .st-parsing { color: var(--warn); } .st-failed { color: var(--err); }

  /* ─── 中栏：对话 ─── */
  #chatPanel { flex: 1; min-width: 0; }
  #chatHead {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  #chatHead .kb-name { font-size: 14px; font-weight: 600; }
  #chatHead .sess { font-size: 12px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #chatInner { max-width: 780px; margin: 0 auto; width: 100%;
               display: flex; flex-direction: column; gap: 14px; }

  .msg {
    max-width: 82%; padding: 11px 15px; border-radius: 14px; line-height: 1.7;
    font-size: 14.5px; word-break: break-word; animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-text);
              border-bottom-right-radius: 5px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--bot-bg); border: 1px solid var(--border);
             border-bottom-left-radius: 5px; box-shadow: var(--shadow); }
  .msg.system { align-self: center; background: transparent; color: var(--muted);
                font-size: 12.5px; padding: 2px; white-space: pre-wrap; max-width: 100%; }
  .msg.error { align-self: center; background: rgba(239, 68, 68, .08); color: var(--err);
               border: 1px solid rgba(239, 68, 68, .35); font-size: 13px; }

  /* 引用角标 */
  sup.cite {
    cursor: pointer; color: var(--primary); font-weight: 600; font-size: 11px;
    background: var(--primary-soft); border-radius: 5px; padding: 0 4px; margin: 0 1px;
    user-select: none;
  }
  sup.cite:hover { background: var(--primary); color: #fff; }

  /* Markdown 样式 */
  .msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot h3, .msg.bot h4, .msg.bot h5 { margin: 12px 0 6px; line-height: 1.4; }
  .msg.bot h3 { font-size: 16px; } .msg.bot h4 { font-size: 15px; } .msg.bot h5 { font-size: 14.5px; }
  .msg.bot ul, .msg.bot ol { margin: 2px 0 8px 22px; }
  .msg.bot li { margin: 3px 0; }
  .msg.bot code { font-family: Consolas, "JetBrains Mono", monospace; font-size: 13px;
                  background: var(--code-bg); padding: 1.5px 6px; border-radius: 5px; }
  .msg.bot pre { background: var(--pre-bg); color: var(--pre-text); padding: 12px 14px;
                 border-radius: 10px; overflow-x: auto; margin: 8px 0; line-height: 1.55; }
  .msg.bot pre code { background: none; padding: 0; font-size: 12.5px; color: inherit; }
  .msg.bot blockquote { border-left: 3px solid var(--primary); padding: 2px 0 2px 12px;
                        color: var(--muted); margin: 6px 0; }
  .msg.bot table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .msg.bot th, .msg.bot td { border: 1px solid var(--border); padding: 5px 12px; text-align: left; }
  .msg.bot th { background: var(--primary-soft); font-weight: 600; }
  .msg.bot hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .msg.bot a { color: var(--primary); text-decoration: none; }

  .thinking {
    align-self: flex-start; background: var(--bot-bg); border: 1px solid var(--border);
    border-radius: 14px; border-bottom-left-radius: 5px; padding: 13px 17px;
    display: none; gap: 5px; box-shadow: var(--shadow);
  }
  .thinking span { width: 7px; height: 7px; border-radius: 50%; background: var(--primary);
                   opacity: .35; animation: blink 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

  /* 快捷指令 + 输入区 */
  #inputArea { flex-shrink: 0; border-top: 1px solid var(--border); padding: 10px 16px 14px; }
  .input-wrap { max-width: 780px; margin: 0 auto; width: 100%; }
  .quick-cmds { display: flex; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
  .chip {
    font-size: 12.5px; color: var(--muted); background: var(--bg);
    border: 1px solid var(--border); border-radius: 14px; padding: 4px 12px;
    cursor: pointer; transition: all .15s;
  }
  .chip:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  .input-row { display: flex; align-items: flex-end; gap: 10px; }
  #input {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 11px;
    padding: 11px 15px; font-size: 14.5px; font-family: inherit; outline: none;
    max-height: 130px; line-height: 1.55; background: var(--bg); color: var(--text);
    transition: border-color .15s;
  }
  #input:focus { border-color: var(--primary); }
  #input:disabled { opacity: .6; }
  #input::placeholder { color: var(--muted); }

  /* ─── 右栏：溯源 ─── */
  #srcPanel { width: 320px; border-left: 1px solid var(--border); flex-shrink: 0; }
  .src-card {
    border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px;
    margin-bottom: 9px; background: var(--bg); cursor: pointer; transition: all .2s;
  }
  .src-card:hover { border-color: var(--primary); }
  .src-card.flash { background: var(--hl); border-color: var(--primary);
                    box-shadow: 0 0 0 3px var(--hl); }
  .src-card .head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .src-card .idx {
    background: var(--primary); color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 6px; padding: 1px 7px; flex-shrink: 0;
  }
  .src-card .file { font-size: 12.5px; font-weight: 600; flex: 1;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-card .page { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
  .src-card .body { font-size: 12.5px; color: var(--muted); line-height: 1.65;
                    max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
  .src-card .meta { margin-top: 7px; font-size: 11px; color: var(--muted); opacity: .8; }

  /* ─── 弹窗 ─── */
  #modalMask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
    display: none; align-items: center; justify-content: center;
  }
  #modalMask.show { display: flex; }
  #modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    width: min(480px, 92vw); max-height: 80vh; display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,.25); animation: pop .18s ease-out;
  }
  #modalTitle { padding: 15px 18px 0; font-size: 15.5px; font-weight: 600; }
  #modalBody { padding: 14px 18px; overflow-y: auto; font-size: 14px; line-height: 1.7; }
  #modalBody input[type=text] {
    width: 100%; border: 1px solid var(--border); border-radius: 9px; outline: none;
    padding: 10px 13px; font-size: 14px; font-family: inherit;
    background: var(--bg); color: var(--text);
  }
  #modalBody input[type=text]:focus { border-color: var(--primary); }
  #modalFoot { padding: 0 18px 16px; display: flex; justify-content: flex-end; gap: 10px; }
  .modal-err { color: var(--err); font-size: 12.5px; margin-top: 8px; display: none; }

  @media (max-width: 1150px) { #srcPanel { display: none; } }
  @media (max-width: 860px) { #kbPanel { display: none; } }
</style>
</head>
<body>

<header>
  <div class="logo">R</div>
  <h1>RAG 知识库系统</h1>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeBtn" title="切换暗色/亮色模式"></button>
</header>

<main>
  <!-- 左栏：知识库管理 -->
  <aside class="panel" id="kbPanel">
    <div class="panel-head">
      <h2>知识库</h2>
      <button class="btn" id="newKbBtn" style="padding:5px 12px;">＋ 新建</button>
    </div>
    <div class="panel-body" id="kbList"></div>
    <div class="panel-head" style="border-top:1px solid var(--border);">
      <h2>文档列表</h2>
      <button class="btn ghost" id="uploadBtn" style="padding:4px 10px;">上传 PDF</button>
      <input type="file" id="fileInput" accept=".pdf" hidden>
    </div>
    <div class="panel-body" id="docList"></div>
  </aside>

  <!-- 中栏：对话 -->
  <section class="panel" id="chatPanel">
    <div id="chatHead">
      <span class="kb-name" id="chatKbName">未选择知识库</span>
      <span class="sess" id="sessTag"></span>
      <div style="flex:1"></div>
      <button class="btn ghost" id="clearBtn" style="padding:5px 12px;">清空会话</button>
    </div>
    <div id="chat"><div id="chatInner">
      <div class="msg system">在左侧选择或新建知识库，上传 PDF 后即可提问。回答中的 [1][2] 角标可点击跳转到右侧原文溯源。</div>
      <div class="thinking" id="thinking"><span></span><span></span><span></span></div>
    </div></div>
    <div id="inputArea"><div class="input-wrap">
      <div class="quick-cmds">
        <span class="chip" data-q="请总结当前知识库文档的主要内容">📄 总结文档</span>
        <span class="chip" data-q="请提取文档中出现的表格或结构化数据，用 Markdown 表格输出">📊 提取表格</span>
        <span class="chip" data-q="请分条列出文档中的关键要点">🔑 列出要点</span>
      </div>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="输入问题，回车发送（Shift+回车换行）"></textarea>
        <button class="btn" id="sendBtn">发送</button>
      </div>
    </div></div>
  </section>

  <!-- 右栏：解析详情与原文溯源 -->
  <aside class="panel" id="srcPanel">
    <div class="panel-head"><h2>引用溯源</h2></div>
    <div class="panel-body" id="srcList">
      <div class="hint">AI 回答时，参考的原始文档片段会显示在这里。<br>点击回答中的 [1][2] 角标可定位到对应片段。</div>
    </div>
  </aside>
</main>

<!-- 弹窗 -->
<div id="modalMask">
  <div id="modal">
    <div id="modalTitle"></div>
    <div id="modalBody"></div>
    <div id="modalFoot"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const chatInner = $("chatInner"), thinking = $("thinking");
const input = $("input"), sendBtn = $("sendBtn");

/* ═══ 主题 ═══ */
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("themeBtn").innerHTML = t === "dark" ? SUN : MOON;
  localStorage.setItem("rag_theme", t);
}
applyTheme(localStorage.getItem("rag_theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("themeBtn").addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* ═══ 状态 ═══ */
let kbs = [];
let currentKb = null;          // {kb_id, name}
let lastSources = [];          // 当前回答的引用来源
let pendingReupload = null;    // 待重新上传的失败 doc_id

function sessionKey() { return "rag_session_" + (currentKb ? currentKb.kb_id : "none"); }
function getSessionId() {
  let sid = localStorage.getItem(sessionKey());
  if (!sid) { sid = crypto.randomUUID(); localStorage.setItem(sessionKey(), sid); }
  return sid;
}

/* ═══ 通用 ═══ */
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function api(path, opts = {}) {
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    let detail = "HTTP " + resp.status;
    try { detail = (await resp.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return resp.json();
}

/* ═══ Markdown 渲染（转义优先，防 XSS） ═══ */
function mdToHtml(src) {
  const codes = [];
  let text = escapeHtml(src).replace(/```[^\n]*\n[\s\S]*?```|```[^\n]*```/g, m => {
    const inner = m.replace(/^```[^\n]*\n?/, "").replace(/```\s*$/, "");
    codes.push("<pre><code>" + inner + "</code></pre>");
    return "\u0001CODE" + (codes.length - 1) + "\u0001";
  });
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const isSep = (l) => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes("-");
  const cells = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => inline(c.trim()));
  const out = [];
  let list = null, quote = false, para = [];
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  const closeQuote = () => { if (quote) { out.push("</blockquote>"); quote = false; } };
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join("")) + "</p>"); para = []; } };
  const lines = text.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trimEnd();
    let m;
    if ((m = line.match(/^\u0001CODE(\d+)\u0001\s*$/))) { flushPara(); closeList(); closeQuote(); out.push(codes[+m[1]]); continue; }
    if (line.includes("|") && i + 1 < lines.length && isSep(lines[i + 1])) {
      flushPara(); closeList(); closeQuote();
      let j = i + 2, rows = [line];
      while (j < lines.length && lines[j].includes("|") && lines[j].trim()) { rows.push(lines[j]); j++; }
      const head = cells(rows[0]);
      let t = "<table><thead><tr>" + head.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
      for (const r of rows.slice(1)) t += "<tr>" + cells(r).map(c => "<td>" + c + "</td>").join("") + "</tr>";
      out.push(t + "</tbody></table>"); i = j - 1; continue;
    }
    if ((m = line.match(/^(#{1,4})\s+(.+)$/))) {
      flushPara(); closeList(); closeQuote();
      const lv = Math.min(m[1].length + 2, 5);
      out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">"); continue;
    }
    if ((m = line.match(/^\s*[-*+]\s+(.+)$/))) {
      flushPara(); closeQuote();
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push("<li>" + inline(m[1]) + "</li>"); continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.+)$/))) {
      flushPara(); closeQuote();
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push("<li>" + inline(m[1]) + "</li>"); continue;
    }
    if ((m = line.match(/^&gt;\s?(.*)$/))) {
      flushPara(); closeList();
      if (!quote) { out.push("<blockquote>"); quote = true; }
      out.push("<p>" + inline(m[1]) + "</p>"); continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); closeList(); closeQuote(); out.push("<hr>"); continue; }
    if (!line.trim()) { flushPara(); closeList(); closeQuote(); continue; }
    flushPara(); para.push(line.trim());
  }
  flushPara(); closeList(); closeQuote();
  return out.join("");
}

/* 渲染机器人回答：Markdown + [n] 引用角标 */
function renderAnswer(answer) {
  let html;
  try { html = mdToHtml(answer); } catch (_) { html = escapeHtml(answer); }
  return html.replace(/\[(\d{1,2})\]/g, '<sup class="cite" data-i="$1">[$1]</sup>');
}

/* ═══ 消息 ═══ */
function addMsg(cls, html) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  chatInner.insertBefore(div, thinking);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}
function setBusy(busy) {
  thinking.style.display = busy ? "flex" : "none";
  $("chat").scrollTop = $("chat").scrollHeight;
  sendBtn.disabled = busy; input.disabled = busy;
}

/* ═══ 右栏：来源卡片 ═══ */
function renderSources(sources) {
  lastSources = sources || [];
  const box = $("srcList");
  if (!lastSources.length) {
    box.innerHTML = '<div class="hint">本次回答没有检索到相关片段。</div>';
    return;
  }
  box.innerHTML = lastSources.map(s => `
    <div class="src-card" data-i="${s.index}">
      <div class="head">
        <span class="idx">[${s.index}]</span>
        <span class="file" title="${escapeHtml(s.source_file)}">${escapeHtml(s.source_file)}</span>
        <span class="page">第 ${escapeHtml(String(s.page ?? "?"))} 页</span>
      </div>
      <div class="body">${escapeHtml(s.content)}</div>
      <div class="meta">doc_id: ${escapeHtml(s.doc_id || "-")}</div>
    </div>`).join("");
}

function flashSource(i) {
  const card = document.querySelector(`.src-card[data-i="${i}"]`);
  if (!card) return;
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.remove("flash"); void card.offsetWidth;
  card.classList.add("flash");
  setTimeout(() => card.classList.remove("flash"), 2200);
}

/* 事件委托：点击角标 → 右栏定位高亮 */
chatInner.addEventListener("click", (e) => {
  const cite = e.target.closest("sup.cite");
  if (cite) flashSource(+cite.dataset.i);
});
$("srcList").addEventListener("click", (e) => {
  const card = e.target.closest(".src-card");
  if (card) flashSource(+card.dataset.i);
});

/* ═══ 知识库列表 ═══ */
async function refreshKbs() {
  kbs = await api("/kbs");
  const box = $("kbList");
  if (!kbs.length) {
    box.innerHTML = '<div class="hint">还没有知识库<br>点击右上角「＋ 新建」创建</div>';
  } else {
    box.innerHTML = kbs.map(k => `
      <div class="kb-item ${currentKb && currentKb.kb_id === k.kb_id ? "active" : ""}" data-id="${k.kb_id}">
        <button class="del" data-id="${k.kb_id}" title="删除知识库">🗑</button>
        <div class="name">${escapeHtml(k.name)}</div>
        <div class="meta">${k.doc_count} 个文档</div>
      </div>`).join("");
  }
}

$("kbList").addEventListener("click", async (e) => {
  const del = e.target.closest(".del");
  if (del) {
    e.stopPropagation();
    const kb = kbs.find(k => k.kb_id === del.dataset.id);
    if (!confirm(`确定删除知识库「${kb.name}」及其全部文档数据？此操作不可恢复。`)) return;
    try {
      await api(`/kbs/${kb.kb_id}`, { method: "DELETE" });
      if (currentKb && currentKb.kb_id === kb.kb_id) selectKb(null);
      await refreshKbs();
    } catch (err) { alert("删除失败：" + err.message); }
    return;
  }
  const item = e.target.closest(".kb-item");
  if (item) selectKb(kbs.find(k => k.kb_id === item.dataset.id));
});

function selectKb(kb) {
  currentKb = kb;
  $("chatKbName").textContent = kb ? kb.name : "未选择知识库";
  $("sessTag").textContent = kb ? ("会话 " + getSessionId().slice(0, 8) + "…") : "";
  chatInner.querySelectorAll(".msg").forEach(el => el.remove());
  addMsg("system", kb
    ? `已进入知识库「${escapeHtml(kb.name)}」。上传文档后开始提问。`
    : "请先在左侧选择或新建知识库。");
  renderSources([]);
  input.disabled = !kb; sendBtn.disabled = !kb;
  refreshKbs(); refreshDocs();
}

/* ═══ 文档列表 ═══ */
async function refreshDocs() {
  const box = $("docList");
  if (!currentKb) { box.innerHTML = '<div class="hint">未选择知识库</div>'; return; }
  try {
    const docs = await api(`/kbs/${currentKb.kb_id}/documents`);
    if (!docs.length) {
      box.innerHTML = '<div class="hint">暂无文档<br>点击上方「上传 PDF」添加</div>';
      return;
    }
    const stMap = { ok: ["✅", "已解析", "st-ok"], parsing: ["⚠️", "解析中", "st-parsing"], failed: ["❌", "解析失败", "st-failed"] };
    box.innerHTML = docs.map(d => {
      const [icon, label, cls] = stMap[d.status] || ["❔", d.status, ""];
      const errTip = d.status === "failed" && d.error ? ` title="${escapeHtml(d.error)}"` : "";
      return `
      <div class="doc-item"${errTip}>
        <div class="row1">
          <span class="fname" title="${escapeHtml(d.filename)}">${escapeHtml(d.filename)}</span>
          <span class="acts">
            ${d.status === "failed" ? `<button class="reup" data-id="${d.doc_id}" title="重新上传">🔄</button>` : ""}
            <button class="view" data-id="${d.doc_id}" title="查看解析摘要">👁</button>
            <button class="danger del-doc" data-id="${d.doc_id}" title="删除文档">🗑</button>
          </span>
        </div>
        <div class="row2"><span class="${cls}">${icon} ${label}</span>
          <span>· ${d.chunk_count} 片段 / ${d.pages} 页</span></div>
      </div>`;
    }).join("");
  } catch (e) { box.innerHTML = `<div class="hint">加载失败：${escapeHtml(String(e.message || e))}</div>`; }
}

$("docList").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn || !currentKb) return;
  const docId = btn.dataset.id;
  if (btn.classList.contains("del-doc")) {
    if (!confirm("确定删除该文档及其向量数据？")) return;
    try { await api(`/kbs/${currentKb.kb_id}/documents/${docId}`, { method: "DELETE" }); await refreshDocs(); await refreshKbs(); }
    catch (err) { alert("删除失败：" + err.message); }
  } else if (btn.classList.contains("view")) {
    const docs = await api(`/kbs/${currentKb.kb_id}/documents`);
    const d = docs.find(x => x.doc_id === docId);
    if (d) openModal("解析摘要 — " + d.filename, `
      <p style="margin-bottom:10px;color:var(--muted);font-size:12.5px;">
        状态：${d.status === "ok" ? "✅ 已解析" : d.status === "parsing" ? "⚠️ 解析中" : "❌ 解析失败"}
        ｜ ${d.chunk_count} 个片段 ｜ ${d.pages} 页 ｜ ${escapeHtml(d.created_at || "")}
        ${d.error ? `<br><span style="color:var(--err)">错误：${escapeHtml(d.error)}</span>` : ""}
      </p>
      <div style="background:var(--bg);border-radius:9px;padding:12px;white-space:pre-wrap;">${escapeHtml(d.summary || "（无摘要）")}${(d.summary || "").length >= 300 ? "…" : ""}</div>`);
  } else if (btn.classList.contains("reup")) {
    pendingReupload = docId;
    $("fileInput").click();
  }
});

/* ═══ 上传 ═══ */
async function upload(file) {
  if (!currentKb) { alert("请先选择知识库"); return; }
  addMsg("system", `正在上传并解析「${escapeHtml(file.name)}」到「${escapeHtml(currentKb.name)}」…`);
  setBusy(true);
  try {
    if (pendingReupload) {
      try { await api(`/kbs/${currentKb.kb_id}/documents/${pendingReupload}`, { method: "DELETE" }); } catch (_) {}
      pendingReupload = null;
    }
    const fd = new FormData();
    fd.append("file", file);
    const data = await api(`/kbs/${currentKb.kb_id}/ingest`, { method: "POST", body: fd });
    addMsg("system", `✅ 入库成功：${escapeHtml(data.filename)}，共 ${data.chunk_count} 个片段 / ${data.pages} 页`);
    await refreshDocs(); await refreshKbs();
  } catch (e) {
    addMsg("error", "上传失败：" + escapeHtml(String(e.message || e)));
    await refreshDocs();
  } finally {
    setBusy(false); $("fileName") && ($("fileName").textContent = "");
    $("fileInput").value = "";
  }
}
$("uploadBtn").addEventListener("click", () => {
  if (!currentKb) { alert("请先选择知识库"); return; }
  pendingReupload = null;
  $("fileInput").click();
});
$("fileInput").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (f) upload(f);
});

/* ═══ 新建知识库弹窗 ═══ */
const modalMask = $("modalMask");
function openModal(title, bodyHtml, footHtml) {
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = bodyHtml;
  $("modalFoot").innerHTML = footHtml || `<button class="btn ghost" onclick="closeModal()">关闭</button>`;
  modalMask.classList.add("show");
}
function closeModal() { modalMask.classList.remove("show"); }
window.closeModal = closeModal;
modalMask.addEventListener("click", (e) => { if (e.target === modalMask) closeModal(); });

$("newKbBtn").addEventListener("click", () => {
  openModal("新建知识库", `
    <input type="text" id="kbNameInput" placeholder="例如：儿童生长标准、公司规章制度" maxlength="30">
    <div class="modal-err" id="kbErr"></div>`,
    `<button class="btn ghost" onclick="closeModal()">取消</button>
     <button class="btn" id="kbCreateBtn">创建</button>`);
  $("kbNameInput").focus();
  $("kbCreateBtn").addEventListener("click", async () => {
    const name = $("kbNameInput").value.trim();
    if (!name) { $("kbErr").textContent = "名称不能为空"; $("kbErr").style.display = "block"; return; }
    try {
      const kb = await api("/kbs", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      closeModal();
      await refreshKbs();
      selectKb(kb);
    } catch (e) {
      $("kbErr").textContent = e.message; $("kbErr").style.display = "block";
    }
  });
  $("kbNameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("kbCreateBtn").click(); });
});

/* ═══ 问答 ═══ */
async function ask(question) {
  if (!currentKb) { alert("请先选择知识库"); return; }
  addMsg("user", escapeHtml(question));
  setBusy(true);
  try {
    const data = await api(`/kbs/${currentKb.kb_id}/query`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, session_id: getSessionId() }),
    });
    localStorage.setItem(sessionKey(), data.session_id);
    $("sessTag").textContent = "会话 " + data.session_id.slice(0, 8) + "…";
    const html = renderAnswer(data.answer);
    addMsg("bot", html);
    renderSources(data.sources);
  } catch (e) {
    addMsg("error", "请求失败：" + escapeHtml(String(e.message || e)));
  } finally {
    setBusy(false); input.focus();
  }
}

sendBtn.addEventListener("click", () => {
  const q = input.value.trim();
  if (!q) return;
  input.value = ""; ask(q);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});
document.querySelectorAll(".chip").forEach(chip =>
  chip.addEventListener("click", () => ask(chip.dataset.q)));

$("clearBtn").addEventListener("click", async () => {
  if (!currentKb) return;
  try { await api(`/kbs/${currentKb.kb_id}/session/${getSessionId()}/clear`, { method: "POST" }); } catch (_) {}
  chatInner.querySelectorAll(".msg").forEach(el => el.remove());
  addMsg("system", "会话已清空。开始新的提问吧。");
  renderSources([]);
});

/* ═══ 初始化 ═══ */
(async function init() {
  input.disabled = true; sendBtn.disabled = true;
  await refreshKbs();
  await refreshDocs();
})();
</script>
</body>
